name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Test
        run: pytest -q
      - name: v0.9 factorized controller rank sweep
        if: matrix.python-version == '3.11'
        run: |
          python experiments/factorized_controller_sweep.py \
            --ranks 1,2,3,4 \
            --steps 300 \
            --seeds 0,1,2 \
            --batch 128 \
            --eval-batch 512 \
            --modules 6 \
            --local-dim 3 \
            --tasks 4 \
            --time 16 \
            --device cpu \
            --output results/v09_ci_reference.json
      - name: Upload v0.9 controller result
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: v09-ci-reference
          path: results/v09_ci_reference.json
