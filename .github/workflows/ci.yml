name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Test
        run: pytest -q
      - name: v0.10 content-conditioned routing reference
        if: matrix.python-version == '3.11'
        run: |
          python experiments/context_route_generalization.py \
            --steps 450 \
            --seeds 0,1,2 \
            --batch 128 \
            --eval-batch 512 \
            --modules 6 \
            --local-dim 3 \
            --context-dim 6 \
            --rank 6 \
            --time 16 \
            --noise 0.03 \
            --noise-multiplier 2 \
            --device cpu \
            --output results/v10_ci_reference.json
      - name: v0.11 unseen-view routing stress
        if: matrix.python-version == '3.11'
        run: |
          python experiments/unseen_view_stress.py \
            --steps 400 \
            --seeds 0,1,2 \
            --noises 0.03,0.06,0.12,0.20 \
            --batch 128 \
            --eval-batch 256 \
            --modules 6 \
            --context-dim 6 \
            --rank 6 \
            --device cpu \
            --output results/v11_ci_reference.json
      - name: v0.12 invariant metric stress
        if: matrix.python-version == '3.11'
        run: |
          python experiments/structural_metric_stress.py \
            --steps 350 \
            --seeds 0,1,2 \
            --batch 64 \
            --eval-batch 64 \
            --train-modules 6 \
            --eval-modules 6,8 \
            --eval-noises 0.03,0.12,0.20,0.30 \
            --device cpu \
            --output results/v12_ci_reference.json
      - name: v0.13 matched training-loss comparison
        if: matrix.python-version == '3.11'
        run: |
          python experiments/route_loss_comparison.py \
            --steps 350 \
            --seeds 0,1,2 \
            --batch 64 \
            --eval-batch 64 \
            --train-modules 6 \
            --eval-modules 6,8 \
            --eval-noises 0.03,0.12,0.20,0.30 \
            --device cpu \
            --output results/v13_ci_reference.json
      - name: Upload v0.13 loss result
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: v13-ci-reference
          path: results/v13_ci_reference.json
      - name: Upload v0.12 structural metric result
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: v12-ci-reference
          path: results/v12_ci_reference.json
      - name: Upload v0.11 routing result
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: v11-ci-reference
          path: results/v11_ci_reference.json
      - name: Upload v0.10 routing result
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: v10-ci-reference
          path: results/v10_ci_reference.json
