name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Test
        run: pytest -q
      - name: v0.6 arbitrary routing reference
        if: matrix.python-version == '3.11'
        run: |
          python experiments/arbitrary_routing_stress.py \
            --steps 100 \
            --seeds 0,1,2 \
            --batch 64 \
            --eval-batch 256 \
            --modules 6 \
            --local-dim 2 \
            --tasks 4 \
            --train-time 4 \
            --long-time 16 \
            --device cpu \
            --output results/v06_ci_reference.json
      - name: Upload v0.6 benchmark result
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: v06-ci-reference
          path: results/v06_ci_reference.json
